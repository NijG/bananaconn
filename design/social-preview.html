<!doctype html>
<!-- GitHub social preview (1280x640). Render:
     msedge --headless=new --window-size=1280,640 --screenshot=docs/social-preview.png design/social-preview.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 18% 30%, rgba(254, 219, 46, 0.10), transparent 60%),
      radial-gradient(700px 480px at 92% 110%, rgba(203, 137, 68, 0.14), transparent 60%),
      #0b0d12;
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    color: #e6e8ee;
    display: flex; align-items: center; gap: 48px; padding: 0 72px; box-sizing: border-box;
  }
  .mark { width: 300px; height: 300px; flex: none; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55)); }
  .text { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  h1 { margin: 0; font-size: 104px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .y { color: #fedb2e; } .c { color: #cb8944; } .x { color: #e8302c; margin-left: 2px; }
  .tag { margin: 0; font-size: 31px; white-space: nowrap; font-weight: 600; color: #f1f2f6; line-height: 1.25; }
  .sub { margin: 0; font-size: 24px; color: #9aa1b2; line-height: 1.4; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 6px; }
  .chips span {
    font-size: 19px; font-weight: 600; padding: 6px 13px; border-radius: 10px;
    background: #171a22; border: 1px solid #2a2f3b; color: #d6d9e2;
  }
  .foot { position: absolute; right: 44px; bottom: 30px; font-size: 20px; color: #6f7686; }
</style>
</head>
<body>
  <img class="mark" src="bananaconn-mark.svg" alt="">
  <div class="text">
    <h1><span class="y">Banana</span><span class="c">Conn</span><span class="x">.</span></h1>
    <p class="tag">All-in-one remote access workspace for Windows</p>
    <p class="sub">Tabs and split panes, risky-command protection,<br>device monitoring and signed auto-updates.</p>
    <div class="chips">
      <span>SSH</span><span>Telnet</span><span>Serial</span><span>SFTP</span><span>FTP/FTPS</span><span>TFTP</span><span>RDP</span><span>VNC</span>
    </div>
  </div>
  <div class="foot">github.com/NijG/bananaconn</div>
</body>
</html>
